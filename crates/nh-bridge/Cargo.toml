[package]
name = "rust_lib_nh_flutter_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
nh-api = { path = "../nh-api" }
nh-storage = { path = "../nh-storage" }
tokio = { version = "1", features = ["full"] }
once_cell = "1"
anyhow = "1"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
