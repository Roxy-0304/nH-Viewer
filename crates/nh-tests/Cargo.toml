[package]
name = "nh-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nh-api = { path = "../nh-api" }
nh-download = { path = "../nh-download" }
nh-storage = { path = "../nh-storage" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures = "0.3"

# Web test server
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
open = "5"
dotenvy = "0.15"

[[bin]]
name = "test_server"
path = "src/bin/test_server.rs"

[lints]
workspace = true