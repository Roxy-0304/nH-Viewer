[package]
name = "nh-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# SQLite (async via sqlx)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# Path & filesystem
dirs = "5.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async support
tokio = { version = "1", features = ["fs", "rt"] }
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
# Anyhow for convenience
anyhow = "1"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
