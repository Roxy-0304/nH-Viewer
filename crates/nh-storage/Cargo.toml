[package]
name = "nh-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
# Path & filesystem
dirs = "5.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async support
tokio = { version = "1", features = ["fs", "rt"] }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
